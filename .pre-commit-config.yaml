# Run `uv run pre-commit install` once to enable.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: mixed-line-ending
      - id: check-case-conflict
      - id: debug-statements
      - id: detect-private-key
      # No no-commit-to-branch: main is what the pages workflow deploys from.

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.15
    hooks:
      - id: ruff
        args: [--fix, --show-fixes, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.11.18
    hooks:
      - id: uv-lock

  - repo: local
    hooks:
      # Maintainer-local and gitignored: the script's word list is itself the private
      # layout it exists to keep out.
      - id: no-private-refs
        name: no references to the private side of this setup
        entry: bash -c 'test -x .githooks/no-private-refs.sh || { echo "restore .githooks/no-private-refs.sh, see CLAUDE.md"; exit 1; }; exec .githooks/no-private-refs.sh'
        language: system
        pass_filenames: false
        always_run: true
