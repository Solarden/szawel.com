[project]
name = "szawel-game"
version = "0.1.0"
description = "Server-authoritative area-control game widget for szawel.com"
requires-python = ">=3.13"
# Empty on purpose: the rules core is pure stdlib — no I/O, no framework, no clock.
dependencies = []

[project.optional-dependencies]
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.50.0",
]
dev = [
    "pytest>=8.3",
    # A socket test that waits for a message the server stopped sending hangs rather than
    # fails, and CI has no way to tell the two apart.
    "pytest-timeout>=2.3",
    "ruff>=0.8",
    "pre-commit>=4.0",
    # fastapi.testclient's transport, needed from the moment there is a socket to test.
    "httpx>=0.28",
]

[tool.uv]
# Nothing here ships as a wheel — the server runs from a checkout on the box, the
# client is static files. A virtual project needs no build backend.
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["game"]
# Generous: the whole suite runs in well under a second, so this only ever catches a hang.
timeout = 10

[tool.ruff]
line-length = 100
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI uses callables in argument defaults by design.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
]
