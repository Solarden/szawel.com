name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy of the live page half-way through.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # SHAs, not tags: this job holds pages: write and id-token: write, so a moved
      # tag would run new code with the credentials that publish the live site.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assemble the published site
        # Only what the site actually serves. The server, the tests and the tooling
        # stay readable on GitHub without being fetchable under the domain.
        # game/client is copied whole, fonts/ included — an explicit file list here
        # would 404 the webfonts silently.
        run: |
          mkdir -p _site
          cp index.html _site/
          # A published tree without CNAME is how the custom domain gets lost.
          cp CNAME _site/
          if [ -d game/client ]; then
            mkdir -p _site/game
            cp -R game/client _site/game/client
          fi

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
