<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <!-- The 1200x630 link-preview card for a case study, rendered by og-card.sh. Never published:
         the Pages workflow does not copy tools/. -->
    <style>
        @font-face {
            font-family: 'Bricolage Grotesque';
            src: url('../game/client/fonts/bricolage-grotesque-latin-wght-normal.woff2') format('woff2');
            font-weight: 200 800;
        }

        @font-face {
            font-family: 'IBM Plex Mono';
            src: url('../game/client/fonts/ibm-plex-mono-latin-400-normal.woff2') format('woff2');
        }

        * { margin: 0; padding: 0; box-sizing: border-box }

        html, body { width: 1200px; height: 630px; overflow: hidden; color: #e9efe9 }

        body {
            padding: 72px 80px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: radial-gradient(900px 500px at 100% 0%, rgba(182, 255, 58, .08), transparent 60%), #0a0d0c;
        }

        .kicker { font: 400 22px 'IBM Plex Mono'; letter-spacing: .14em; color: #979a99; text-transform: uppercase }
        h1 { font: 800 64px/1.06 'Bricolage Grotesque'; letter-spacing: -.025em; margin-top: 26px; max-width: 1040px }
        .number { font: 800 52px 'Bricolage Grotesque'; color: #b6ff3a; letter-spacing: -.02em; margin-top: 28px }
        .foot { display: flex; justify-content: space-between; align-items: flex-end; font: 400 24px 'IBM Plex Mono'; color: #979a99 }
        .foot b { font: 700 32px 'Bricolage Grotesque'; color: #e9efe9 }
    </style>
</head>
<body>
<div>
    <div class="kicker" id="kicker"></div>
    <h1 id="title"></h1>
    <div class="number" id="number"></div>
</div>
<div class="foot">
    <div><b>Paweł Chraczyński</b><br>independent consulting · EU</div>
    <div>szawel.com</div>
</div>
<script>
    const params = new URLSearchParams(location.search);

    for (const id of ["kicker", "title", "number"]) {
        document.getElementById(id).textContent = params.get(id) || "";
    }
</script>
</body>
</html>
